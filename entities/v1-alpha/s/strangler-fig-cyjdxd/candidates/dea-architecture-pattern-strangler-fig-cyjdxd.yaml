type: ArchitecturePattern
name: Strangler Fig
description: 'Strangler Fig — published architecture pattern: Incrementally migrate
  a legacy system by gradually replacing pieces with new services.'
version: 0.1.0
lifecycle_status: proposed
problem: Incrementally migrate a legacy system by gradually replacing pieces with
  new services.
solution: Big-bang rewrites are risky; legacy must keep serving during migration.
applicability:
- Facelift migrations routed via a facade over both old and new.
