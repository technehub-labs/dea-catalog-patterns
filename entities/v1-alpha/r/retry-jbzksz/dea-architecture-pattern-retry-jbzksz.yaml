id: dea:architecture-pattern-retry-jbzksz
type: ArchitecturePattern
name: Retry
description: 'Retry — published architecture pattern: Enable an application to handle
  transient failures by retrying failed operations transparently.'
version: 0.1.0
lifecycle_status: active
problem: Enable an application to handle transient failures by retrying failed operations
  transparently.
solution: Transient faults (network blips, throttling) fail calls that would succeed
  later.
applicability:
- Clients of remote services with transient error modes.
