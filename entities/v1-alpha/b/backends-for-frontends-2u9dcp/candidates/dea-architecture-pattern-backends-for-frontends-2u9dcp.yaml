id: dea:architecture-pattern-backends-for-frontends-2u9dcp
type: ArchitecturePattern
name: Backends for Frontends
description: 'Backends for Frontends — published architecture pattern: Create separate backend services
  to be consumed by specific front-end applications or interfaces.'
version: 0.1.0
lifecycle_status: proposed
problem: Create separate backend services to be consumed by specific front-end applications or interfaces.
solution: One shared backend cannot serve desktop, mobile, and web clients well because each needs different
  payloads and shapes.
applicability:
- Microservice systems with multiple client types and bespoke aggregation needs.
