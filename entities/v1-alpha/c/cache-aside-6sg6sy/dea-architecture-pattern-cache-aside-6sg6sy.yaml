id: dea:architecture-pattern-cache-aside-6sg6sy
type: ArchitecturePattern
name: Cache-Aside
description: 'Cache-Aside — published architecture pattern: Load data on demand into
  a cache from a data store.'
version: 0.1.0
lifecycle_status: active
problem: Load data on demand into a cache from a data store.
solution: Reading from the primary store on every request is slower than the latency
  budget allows.
applicability:
- Read-heavy workloads with tolerable staleness; expensive computed queries.
