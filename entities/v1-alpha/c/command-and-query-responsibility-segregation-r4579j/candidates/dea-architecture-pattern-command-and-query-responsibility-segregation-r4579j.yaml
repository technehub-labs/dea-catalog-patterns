id: dea:architecture-pattern-command-and-query-responsibility-segregation-r4579j
type: ArchitecturePattern
name: Command and Query Responsibility Segregation
description: 'Command and Query Responsibility Segregation — published architecture pattern: Separate
  the model used to update data from the model used to read data.'
version: 0.1.0
lifecycle_status: proposed
problem: Separate the model used to update data from the model used to read data.
solution: One shared model cannot serve both transactional writes and rich reads.
applicability:
- High-traffic systems with complex domain writes and flexible read shapes.
