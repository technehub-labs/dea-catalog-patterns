id: dea:architecture-pattern-compensating-transaction-ndpqfu
type: ArchitecturePattern
name: Compensating Transaction
description: 'Compensating Transaction — published architecture pattern: Undo the
  work performed by a series of steps that together define an eventually consistent
  operation.'
version: 0.1.0
lifecycle_status: active
problem: Undo the work performed by a series of steps that together define an eventually
  consistent operation.
solution: Distributed transactions cannot rely on two-phase commit across heterogeneous
  services.
applicability:
- Saga-style workflows with compensating actions per step.
