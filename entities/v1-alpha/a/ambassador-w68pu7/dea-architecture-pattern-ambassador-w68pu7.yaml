id: dea:architecture-pattern-ambassador-w68pu7
type: ArchitecturePattern
name: Ambassador
description: 'Ambassador — published architecture pattern: Create a helper service
  that sends network requests on behalf of a consumer service or application.'
version: 0.1.0
lifecycle_status: active
problem: Create a helper service that sends network requests on behalf of a consumer
  service or application.
solution: Route requests through an out-of-process proxy that handles cross-cutting
  connectivity concerns like retry, circuit breaking, and telemetry.
applicability:
- Applications that consume remote services where connection handling must be centralized;
  legacy services that cannot embed client libraries.
