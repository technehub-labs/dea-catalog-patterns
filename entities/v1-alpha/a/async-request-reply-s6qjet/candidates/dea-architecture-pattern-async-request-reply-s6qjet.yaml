id: dea:architecture-pattern-async-request-reply-s6qjet
type: ArchitecturePattern
name: Async Request-Reply
description: 'Async Request-Reply — published architecture pattern: Decouple backend processing from a
  front-end host where the backend processes requests asynchronously.'
version: 0.1.0
lifecycle_status: proposed
problem: Decouple backend processing from a front-end host where the backend processes requests asynchronously.
solution: HTTP request/response clients must call long-running operations without holding connections
  open.
applicability:
- Public APIs wrapping long-running background work.
