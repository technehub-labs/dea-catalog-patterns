id: dea:architecture-pattern-anti-corruption-layer-gkkk3m
type: ArchitecturePattern
name: Anti-Corruption Layer
description: 'Anti-Corruption Layer — published architecture pattern: Implement a facade or adapter layer
  between a modern application and a legacy system to keep domain models clean.'
version: 0.1.0
lifecycle_status: proposed
problem: Implement a facade or adapter layer between a modern application and a legacy system to keep
  domain models clean.
solution: Two subsystems with different domain models must interoperate without either adopting the other's
  model.
applicability:
- Migrating legacy systems incrementally; integrating third-party or external systems.
