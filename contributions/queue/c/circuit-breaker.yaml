name: Circuit Breaker
description: 'Circuit Breaker — published architecture pattern: Handle faults that might take a variable
  amount of time to recover from when connecting to a remote service.'
problem: Handle faults that might take a variable amount of time to recover from when connecting to a
  remote service.
solution: Repeated calls to a failing service waste resources and propagate failure.
applicability: Network calls where transient failure can cascade; service meshes and clients alike.
