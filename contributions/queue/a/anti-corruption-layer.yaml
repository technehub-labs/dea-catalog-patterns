problem: Implement a facade or adapter layer between a modern application and a legacy system to keep
  domain models clean.
solution: Two subsystems with different domain models must interoperate without either adopting the other's
  model.
applicability:
- Migrating legacy systems incrementally; integrating third-party or external systems.
