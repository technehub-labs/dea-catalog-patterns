name: Bulkhead
description: 'Bulkhead — published architecture pattern: Isolate elements of an application into pools
  so that if one fails, the others continue to function.'
problem: Isolate elements of an application into pools so that if one fails, the others continue to function.
solution: A single failing dependency or tenant can exhaust shared resources and cascade failure.
applicability:
- Multi-tenant services; mixed-criticality workloads sharing process or connection pools.
